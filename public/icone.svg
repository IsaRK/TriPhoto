<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icône de TriPhoto : la marque du logo (une photo entourée des quatre
  directions de swipe), sans le mot « TriPhoto » qui serait illisible en 48 px.

  Les couleurs sont écrites en dur et non en variables CSS : ce fichier est
  chargé hors de la page (favicon, icône d'installation), où le thème n'existe
  pas. Elles doivent rester d'accord avec `src/ui/theme.css` et
  `src/tri/directions.ts` — un test le vérifie.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect width="48" height="48" fill="#f7f5f2" />
  <g transform="translate(0, 2)">
    <rect
      x="14"
      y="12"
      width="20"
      height="20"
      rx="4"
      fill="none"
      stroke="#405885"
      stroke-width="2"
    />
    <circle cx="24" cy="22" r="4" fill="#405885" />
    <path d="M 2 22 L 10 15 L 10 29 Z" fill="#405885" />
    <path d="M 46 22 L 38 15 L 38 29 Z" fill="#ffa530" />
    <path d="M 24 0 L 17 8 L 31 8 Z" fill="#50aca2" />
    <path d="M 24 44 L 17 36 L 31 36 Z" fill="#e0748b" />
  </g>
</svg>
